<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1054 700" fill="none" stroke="#C4C5B9" stroke-width="1">
  <!-- Vespa squared shape figure for medium screens and smaller (horizontals come from hero-lines.svg) -->
  <g vector-effect="non-scaling-stroke">
    <!-- outer verticals: full height -->
    <line x1="340" y1="0" x2="340" y2="700" vector-effect="non-scaling-stroke"/>
    <line x1="715" y1="0" x2="715" y2="700" vector-effect="non-scaling-stroke"/>
    <!-- center square: sides only, no extension -->
    <line x1="442" y1="258" x2="613" y2="258" vector-effect="non-scaling-stroke"/>
    <line x1="442" y1="441" x2="613" y2="441" vector-effect="non-scaling-stroke"/>
    <line x1="442" y1="258" x2="442" y2="441" vector-effect="non-scaling-stroke"/>
    <line x1="613" y1="258" x2="613" y2="441" vector-effect="non-scaling-stroke"/>
    <!-- diagonals: touching the square's opposite corners, exiting the canvas edges -->
    <line x1="0" y1="700" x2="700" y2="0" vector-effect="non-scaling-stroke"/>
    <line x1="354" y1="700" x2="1054" y2="0" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
