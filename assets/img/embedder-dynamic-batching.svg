<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic batching with concurrency=2 and max-size=8</title>
  <desc id="desc">Two successive states show the queue and two concurrent inference calls on one GPU. All inputs are padded to the same token length. Requests C, D and E arrive while A and B are running and wait in the queue. When A finishes, C, D and E run together as a batch of three while B keeps running. The new batch starts without waiting for the maximum of eight requests.</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="28" y="32" font-size="21">Dynamic batching</text>
    <text x="844" y="32" text-anchor="end" font-family="monospace" font-size="17">concurrency=2 · max-size=8</text>
    <text x="28" y="64" font-size="17" fill="#555555">Inputs padded to the same token length.</text>

    <text x="28" y="110" font-size="19">Event</text>
    <text x="389" y="110" text-anchor="middle" font-size="19">Queued requests</text>
    <text x="723" y="110" text-anchor="middle" font-size="19">GPU inference</text>
    <path d="M 28 124 H 848 M 28 234 H 848" fill="none" stroke="#d2d2d2" stroke-width="1"/>

    <text x="28" y="167" font-size="21">A and B are running</text>
    <text x="28" y="197" font-size="18" fill="#555555">C, D, E arrive</text>
    <g fill="#ffffff" stroke="#555555" stroke-width="1.2">
      <rect x="308" y="143" width="42" height="44"/>
      <rect x="368" y="143" width="42" height="44"/>
      <rect x="428" y="143" width="42" height="44"/>
    </g>
    <g font-family="monospace" font-size="22" text-anchor="middle">
      <text x="329" y="173">C</text>
      <text x="389" y="173">D</text>
      <text x="449" y="173">E</text>
    </g>
    <text x="537" y="172" text-anchor="middle" font-size="18" fill="#555555">Wait</text>
    <g fill="#f2f2f2" stroke="#555555" stroke-width="1.2">
      <rect x="604" y="141" width="108" height="48"/>
      <rect x="734" y="141" width="108" height="48"/>
    </g>
    <g text-anchor="middle" font-family="monospace" font-size="22">
      <text x="658" y="173">A</text>
      <text x="788" y="173">B</text>
    </g>
    <g text-anchor="middle" font-size="17" fill="#555555">
      <text x="658" y="215">Batch of 1</text>
      <text x="788" y="215">Batch of 1</text>
    </g>

    <text x="28" y="277" font-size="21">A finishes</text>
    <text x="28" y="307" font-size="18" fill="#555555">B keeps running</text>
    <g fill="#ffffff" stroke="#555555" stroke-width="1.2">
      <rect x="308" y="253" width="42" height="44"/>
      <rect x="368" y="253" width="42" height="44"/>
      <rect x="428" y="253" width="42" height="44"/>
    </g>
    <g font-family="monospace" font-size="22" text-anchor="middle">
      <text x="329" y="283">C</text>
      <text x="389" y="283">D</text>
      <text x="449" y="283">E</text>
    </g>
    <path d="M 490 275 H 582 M 574 270 L 582 275 L 574 280" fill="none" stroke="#555555" stroke-width="1.2"/>
    <rect x="604" y="251" width="108" height="48" fill="#eef5f0" stroke="#1b6a3a" stroke-width="1.5"/>
    <g font-family="monospace" font-size="22" text-anchor="middle" fill="#1b6a3a">
      <text x="624" y="283">C</text>
      <text x="658" y="283">D</text>
      <text x="692" y="283">E</text>
    </g>
    <rect x="734" y="251" width="108" height="48" fill="#f2f2f2" stroke="#555555" stroke-width="1.2"/>
    <text x="788" y="283" text-anchor="middle" font-family="monospace" font-size="22">B</text>
    <text x="658" y="325" text-anchor="middle" font-size="17" fill="#1b6a3a">Batch of 3</text>
    <text x="788" y="325" text-anchor="middle" font-size="17" fill="#555555">Still running</text>
  </g>
</svg>
