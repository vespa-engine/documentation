<svg xmlns="http://www.w3.org/2000/svg" width="880" height="324" viewBox="0 0 880 324" role="img" aria-labelledby="title desc">
  <title id="title">Padding inputs to buckets of 32 and 64 tokens</title>
  <desc id="desc">Green segments show input tokens; gray segments show added padding. Inputs of 12 and 25 tokens are padded to 32 tokens and can share a batch. An input of 40 tokens is padded to 64 tokens and runs in a separate batch. Bar lengths are proportional to token counts.</desc>
  <rect width="880" height="324" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="28" y="32" font-size="21">Padding</text>
    <text x="844" y="32" text-anchor="end" font-family="monospace" font-size="17">padding-buckets: 32 64</text>

    <rect x="28" y="55" width="16" height="14" fill="#eef5f0" stroke="#1b6a3a" stroke-width="1.2"/>
    <text x="54" y="68" font-size="17" fill="#555555">Input tokens</text>
    <rect x="198" y="55" width="16" height="14" fill="#f2f2f2" stroke="#999999" stroke-width="1.2"/>
    <text x="224" y="68" font-size="17" fill="#555555">Padding</text>

    <g font-size="19">
      <text x="28" y="137">12 tokens</text>
      <text x="28" y="209">25 tokens</text>
      <text x="28" y="281">40 tokens</text>
    </g>
    <g fill="#f2f2f2" stroke="#999999" stroke-width="1.2">
      <rect x="180" y="112" width="160" height="36"/>
      <rect x="180" y="184" width="160" height="36"/>
      <rect x="180" y="256" width="320" height="36"/>
    </g>
    <g fill="#eef5f0" stroke="#1b6a3a" stroke-width="1.2">
      <rect x="180" y="112" width="60" height="36"/>
      <rect x="180" y="184" width="125" height="36"/>
      <rect x="180" y="256" width="200" height="36"/>
    </g>
    <g font-size="19" text-anchor="middle">
      <text x="550" y="137">32 tokens</text>
      <text x="550" y="209">32 tokens</text>
      <text x="550" y="281">64 tokens</text>
    </g>
    <path d="M 608 112 H 622 V 220 H 608 M 622 166 H 636" fill="none" stroke="#555555" stroke-width="1.2"/>
    <text x="650" y="159" font-size="18">Can share</text>
    <text x="650" y="185" font-size="18">a batch</text>
    <text x="650" y="281" font-size="18">Separate batch</text>
  </g>
</svg>
