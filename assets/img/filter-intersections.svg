<svg xmlns="http://www.w3.org/2000/svg" width="810" height="400" viewBox="0 0 810 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="810" height="400" fill="#fff"/>

  <!-- Request -->
  <rect x="20" y="20" width="240" height="160" rx="6" fill="#fff" stroke="#1b6a3a" stroke-width="2"/>
  <text x="140" y="42" text-anchor="middle" font-weight="bold">Request</text>
  <text x="32" y="68" font-family="Menlo, monospace" font-size="11">yql = shoes</text>
  <text x="32" y="94" font-size="12">filters:</text>
  <text x="44" y="112" font-family="Menlo, monospace" font-size="11">brand</text>
  <text x="44" y="128" font-family="Menlo, monospace" font-size="11">instock</text>
  <text x="44" y="144" font-family="Menlo, monospace" font-size="11">onsale</text>

  <!-- Response -->
  <rect x="20" y="205" width="240" height="175" rx="6" fill="#fff" stroke="#1b6a3a" stroke-width="2"/>
  <text x="140" y="227" text-anchor="middle" font-weight="bold">Response</text>
  <text x="32" y="251" font-size="12">hits</text>
  <text x="32" y="275" font-size="12">filterIntersections:</text>
  <g font-family="Menlo, monospace" font-size="11">
    <text x="44" y="295">|shoes ∩ brand| = 300</text>
    <text x="44" y="311">|shoes ∩ instock| = 900</text>
    <text x="44" y="327">|shoes ∩ onsale| = 200</text>
    <text x="44" y="343">|shoes ∩ brand ∩ instock| = 240</text>
    <text x="44" y="359">...</text>
  </g>

  <!-- Arrow request -> container -->
  <line x1="260" y1="100" x2="295" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow container -> response -->
  <line x1="300" y1="295" x2="265" y2="295" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Container nodes -->
  <rect x="300" y="20" width="240" height="360" rx="6" fill="#f6f8f7" stroke="#1b6a3a" stroke-width="2"/>
  <text x="420" y="42" text-anchor="middle" font-weight="bold">Container nodes</text>
  <text x="420" y="58" text-anchor="middle" font-size="11" fill="#444">FilterIntersectionsSearcher</text>

  <rect x="315" y="72" width="210" height="34" rx="4" fill="#fff" stroke="#1b6a3a" stroke-width="1.5"/>
  <text x="420" y="88" text-anchor="middle" font-size="12" font-weight="bold">your query</text>
  <text x="420" y="100" text-anchor="middle" font-size="10" fill="#444">shoes, with hits and ranking</text>

  <g font-family="Menlo, monospace" font-size="11">
    <rect x="315" y="118" width="210" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="325" y="135">|shoes ∩ brand|</text>
    <rect x="315" y="150" width="210" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="325" y="167">|shoes ∩ instock|</text>
    <rect x="315" y="182" width="210" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="325" y="199">|shoes ∩ onsale|</text>
    <rect x="315" y="214" width="210" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="325" y="231">|shoes ∩ brand ∩ instock|</text>
    <rect x="315" y="246" width="210" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="325" y="263">|shoes ∩ brand ∩ onsale|</text>
    <rect x="315" y="278" width="210" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="325" y="295">|shoes ∩ instock ∩ onsale|</text>
  </g>
  <text x="420" y="330" text-anchor="middle" font-size="11" fill="#444">6 filter intersection cells, count only</text>
  <text x="420" y="346" text-anchor="middle" font-size="11" fill="#444">all sent at the same time</text>

  <!-- Arrows container -> content, one per sub-block -->
  <g stroke="#555" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="540" y1="89" x2="575" y2="89"/>
    <line x1="540" y1="131" x2="575" y2="131"/>
    <line x1="540" y1="163" x2="575" y2="163"/>
    <line x1="540" y1="195" x2="575" y2="195"/>
    <line x1="540" y1="227" x2="575" y2="227"/>
    <line x1="540" y1="259" x2="575" y2="259"/>
    <line x1="540" y1="291" x2="575" y2="291"/>
  </g>

  <!-- Content nodes -->
  <rect x="580" y="20" width="210" height="360" rx="6" fill="#f6f8f7" stroke="#1b6a3a" stroke-width="2"/>
  <text x="685" y="42" text-anchor="middle" font-weight="bold">Content nodes</text>

  <rect x="595" y="72" width="180" height="34" rx="4" fill="#fff" stroke="#1b6a3a" stroke-width="1.5"/>
  <text x="685" y="88" text-anchor="middle" font-size="12" font-weight="bold">match, rank</text>
  <text x="685" y="100" text-anchor="middle" font-size="10" fill="#444">return hits</text>

  <g font-family="Menlo, monospace" font-size="11">
    <rect x="595" y="118" width="180" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="605" y="135">count = 300</text>
    <rect x="595" y="150" width="180" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="605" y="167">count = 900</text>
    <rect x="595" y="182" width="180" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="605" y="199">count = 200</text>
    <rect x="595" y="214" width="180" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="605" y="231">count = 240</text>
    <rect x="595" y="246" width="180" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="605" y="263">count = 60</text>
    <rect x="595" y="278" width="180" height="26" rx="4" fill="#fff" stroke="#888"/>
    <text x="605" y="295">count = 150</text>
  </g>
  <text x="685" y="330" text-anchor="middle" font-size="11" fill="#444">filter intersection cells: zero hits</text>
</svg>
