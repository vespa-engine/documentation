<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1336 700" fill="none" stroke="#C4C5B9" stroke-width="1">
  <!-- Vespa horizontal shape figure: verticals, center wide rectangle, and diagonals (horizontals come from hero-lines.svg) -->
  <g vector-effect="non-scaling-stroke">
    <!-- outer verticals: full height -->
    <line x1="292" y1="0" x2="292" y2="700" vector-effect="non-scaling-stroke"/>
    <line x1="1045" y1="0" x2="1045" y2="700" vector-effect="non-scaling-stroke"/>
    <!-- center wide rectangle: sides only, no extension -->
    <line x1="418" y1="282" x2="919" y2="282" vector-effect="non-scaling-stroke"/>
    <line x1="418" y1="417" x2="919" y2="417" vector-effect="non-scaling-stroke"/>
    <line x1="418" y1="282" x2="418" y2="417" vector-effect="non-scaling-stroke"/>
    <line x1="919" y1="282" x2="919" y2="417" vector-effect="non-scaling-stroke"/>
    <!-- diagonals: touching the rectangle's opposite corners, exiting the canvas edges -->
    <line x1="0" y1="700" x2="700" y2="0" vector-effect="non-scaling-stroke"/>
    <line x1="636" y1="700" x2="1336" y2="0" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
