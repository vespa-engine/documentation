name: Autoupdate Documentation
#
#  Takes care of updating the Vespa documentation.
#

on:
  workflow_dispatch: # Allow manual triggering of the workflow

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    # This ensures that options "pipefail" and "errexit" are set for all steps.
    # Ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#defaultsrunshell
    shell: bash

# Limit concurrency to better handle commit and push operations.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  update-vespa-version:
    #
    # This job updates the Vespa version in the documentation.
    #
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xq

      - name: Update Vespa version
        id: update-docs
        run: |
          VESPA_VERSION=$(curl -sSL https://repo1.maven.org/maven2/com/yahoo/vespa/parent/maven-metadata.xml | \
           xq -x '/metadata/versioning/latest')

          echo "Vespa version: $VESPA_VERSION"
          echo "version=$VESPA_VERSION" >> $GITHUB_OUTPUT

          # Update the Vespa version in the documentation configuration file.
          sed -i'' "s/\(vespa_version:\) \"[0-9\.]*\"/\1 \"${VESPA_VERSION}\"/" _config.yml

          git diff
          echo "has-changes=$(git status --short | wc -l)" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: ${{ steps.update-docs.outputs.has-changes != '0' }}
        uses: ./.github/actions/commit-updated-docs
        with:
          commit-message: "Update Vespa version to ${{ steps.update-docs.outputs.version }}."
          files: _config.yml
          push: ${{ contains(fromJSON('["workflow_dispatch", "schedule"]'), github.event_name) && github.ref_name == 'master' }}

  update-vespa-cli-doc:
    #
    # This job updates the Vespa CLI documentation.
    #
    runs-on: ubuntu-latest

    # Make sure each job runs after the previous one, regardless of the outcome.
    # This trick is useful to prevent two jobs from running concurrently and trying to
    #  push changes to the repository at the same time.
    if: ${{ success() || failure() }}
    needs:
      - update-vespa-version

    env:
      VESPA_CLI_DOC_DIR: en/reference/clients/vespa-cli

    steps:
      - uses: actions/checkout@v6

      - name: Install Vespa CLI
        uses: vespa-engine/setup-vespa-cli-action@v1

      - name: Generate Vespa CLI Documentation
        id: update-docs
        working-directory: ${{ env.VESPA_CLI_DOC_DIR }}
        run: |
          vespa gendoc .

          for f in $(git status --short . | awk '{print $2}'); do
            title=${f//.md/}
            title=${title//.\//}
            title=${title//_/ }
            (echo -e "---\ntitle: $title\nrender_with_liquid: false\n---\n"; cat ${f}) > ${f}.new
            mv ${f}.new ${f};
          done

          # ensure links are to .html
          sed -i'' 's/\(vespa.*\).md)/\1.html)/' *.md
          # create links
          sed -i'' 's#\(https://[a-z.]*vespa.ai/[^[:space:]]*\)#[\1](\1)#g' *.md

          git diff
          echo "has-changes=$(git status --short | wc -l)" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: ${{ steps.update-docs.outputs.has-changes != '0' }}
        uses: ./.github/actions/commit-updated-docs
        with:
          commit-message: "Update 'Vespa-CLI' reference documentation."
          files: ${{ env.VESPA_CLI_DOC_DIR }}
          push: ${{ contains(fromJSON('["workflow_dispatch", "schedule"]'), github.event_name) && github.ref_name == 'master' }}

  update-metric-reference:
    #
    # This job updates the Vespa metric reference documentation.
    # Ref https://github.com/vespa-engine/vespa/blob/master/metrics/src/main/java/ai/vespa/metrics/docs/MetricDocumentation.java
    #
    runs-on: ubuntu-24.04 # Use Ubuntu 24.04 for the xq dependency

    # Make sure each job runs after the previous one, regardless of the outcome.
    # This trick is useful to prevent two jobs from running concurrently and trying to
    #  push changes to the repository at the same time.
    if: ${{ success() || failure() }}
    needs:
      - update-vespa-cli-doc

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup xq
        run: |
          sudo apt-get install -y xq

      - name: Get Latest Vespa version
        id: vespa-metadata
        run: |
          VESPA_VERSION=$(curl -sSL https://repo1.maven.org/maven2/com/yahoo/vespa/parent/maven-metadata.xml | \
           xq -x '/metadata/versioning/latest')
          echo "Using version: ${VESPA_VERSION}"
          echo "version=$VESPA_VERSION" >> "${GITHUB_OUTPUT}"

      - name: Update Metric Reference
        id: update-docs
        env:
          VESPA_VERSION: ${{ steps.vespa-metadata.outputs.version }}
        run: |
          curl -SsLo metrics.jar "https://repo1.maven.org/maven2/com/yahoo/vespa/metrics/${VESPA_VERSION}/metrics-${VESPA_VERSION}.jar"
          java -cp metrics.jar ai.vespa.metrics.docs.DocumentationGenerator en/reference/operations/metrics
          rm metrics.jar
          
          git diff -- en/reference
          echo "has-changes=$(git status --short -- en/reference | wc -l)" >> "${GITHUB_OUTPUT}"

      - name: Commit changes
        if: ${{ steps.update-docs.outputs.has-changes != '0' }}
        uses: ./.github/actions/commit-updated-docs
        with:
          commit-message: "Update 'Metric' reference documentation."
          files: "en/reference/operations/metrics/*.html"
          push: ${{ contains(fromJSON('["workflow_dispatch", "schedule"]'), github.event_name) && github.ref_name == 'master' }}

  update-grammars:
    #
    # This job copies the TextMate grammars in _grammars/ from vespa-engine/vespa, where they are
    # maintained, and opens a pull request for review when they have changed. It does not merge:
    # pull requests opened with the workflow token do not trigger the PR build, so the copy is
    # checked here before the pull request is opened.
    # Ref https://github.com/vespa-engine/vespa/tree/master/integration/tmgrammar/grammars
    #
    runs-on: ubuntu-latest

    # Make sure each job runs after the previous one, regardless of the outcome.
    if: ${{ success() || failure() }}
    needs:
      - update-metric-reference

    env:
      VESPA_GRAMMARS: integration/tmgrammar/grammars
      PR_BRANCH: update-grammars

    steps:
      - uses: actions/checkout@v6

      - name: Copy grammars from vespa-engine/vespa
        id: update-grammars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Copy from one commit, so that all grammars and the pull request refer to the same version.
          VESPA_SHA=$(gh api repos/vespa-engine/vespa/commits/master --jq .sha)
          echo "Using vespa-engine/vespa@${VESPA_SHA}"
          echo "vespa-sha=${VESPA_SHA}" >> "${GITHUB_OUTPUT}"

          for f in _grammars/*.tmLanguage.json; do
            curl -sSfL -o "${f}" "https://raw.githubusercontent.com/vespa-engine/vespa/${VESPA_SHA}/${VESPA_GRAMMARS}/$(basename "${f}")"
          done

          git diff --stat -- _grammars
          echo "has-changes=$(git status --short -- _grammars | wc -l)" >> "${GITHUB_OUTPUT}"

      - name: Setup Ruby
        if: ${{ steps.update-grammars.outputs.has-changes != '0' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.3"
          bundler-cache: true
          cache-version: 0

      - name: Check the grammars
        if: ${{ steps.update-grammars.outputs.has-changes != '0' }}
        run: |
          bundle exec ruby test/test_rouge_lexers.rb
          bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Open or update pull request
        if: ${{ steps.update-grammars.outputs.has-changes != '0' && contains(fromJSON('["workflow_dispatch", "schedule"]'), github.event_name) && github.ref_name == 'master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VESPA_SHA: ${{ steps.update-grammars.outputs.vespa-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config --global user.email "bot+actions@vespa.ai"
          git config --global user.name "${{ github.actor }}"

          # Leave an open pull request alone until vespa-engine/vespa changes the grammars again.
          if git fetch -q origin "${PR_BRANCH}" 2>/dev/null && git diff --quiet FETCH_HEAD -- _grammars; then
            echo "Branch ${PR_BRANCH} already has these grammars."
            exit 0
          fi

          # One branch for all grammar updates: a newer copy replaces the one in an open pull request.
          git checkout -B "${PR_BRANCH}"
          git add _grammars
          git commit -m "Update grammars from vespa-engine/vespa" -m "Copied from vespa-engine/vespa@${VESPA_SHA}."
          git push --force origin "${PR_BRANCH}"

          cat > pr-body.md <<BODY
          The grammars in \`_grammars/\` are copies of the ones in [vespa-engine/vespa/${VESPA_GRAMMARS}](https://github.com/vespa-engine/vespa/tree/${VESPA_SHA}/${VESPA_GRAMMARS}), copied from vespa-engine/vespa@${VESPA_SHA}. Change the grammars in vespa-engine/vespa; this pull request is opened or updated by the nightly [Autoupdate Documentation](${RUN_URL}) workflow when they change.

          The workflow checked the copy with \`test/test_rouge_lexers.rb\` and a site build before opening this pull request. Review the highlighting of a page with a changed language before merging.
          BODY

          if [ -z "$(gh pr list --head "${PR_BRANCH}" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base master --head "${PR_BRANCH}" --title "Update grammars from vespa-engine/vespa" --body-file pr-body.md
          else
            gh pr edit "${PR_BRANCH}" --body-file pr-body.md
          fi
